; Glance firmware for the Seeed reTerminal E1001 (XIAO ESP32-S3, 7.5" UC8179
; e-paper, 800x480, 4 greys). Fetches the image the server renders and draws it.
;
;   mise run build      build            (tools from mise.toml: mise install)
;   mise run upload     flash (reTerminal on USB-C)
;   mise run monitor    log (UART1 via the on-board USB bridge; resets the device)

[env:reterminal_e1001]
; Pinned, like the library below, so a build doesn't silently pick up a new
; toolchain or Arduino core. Raise it deliberately.
platform = espressif32@8.0.0
board = seeed_xiao_esp32s3
framework = arduino
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
; The reTerminal's USB-serial bridge (CH340) on macOS. Without this PlatformIO
; may pick another serial port (it picked a Bluetooth device here). On Linux
; change both to /dev/ttyUSB* (on Windows to the bridge's COM port).
upload_port = /dev/cu.usbserial-*
monitor_port = /dev/cu.usbserial-*
build_flags =
    -DBOARD_HAS_PSRAM
    ; Seeed_GFX: select the reTerminal E1001 setup (Setup520, UC8179 800x480).
    -DBOARD_SCREEN_COMBO=520
lib_deps =
    ; Pinned to a commit; Seeed's own e-paper library (TFT_eSPI fork) with 4-grey support.
    https://github.com/Seeed-Studio/Seeed_GFX.git#0dfdd7135425be82b5bb4b4b58d74dd51ab29a59
