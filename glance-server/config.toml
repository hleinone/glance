# Glance configuration. Secrets do not go here: put the Digitransit key in
# config.local.toml (git-ignored, overrides this file):
#
#   [digitransit]
#   key = "..."
#
# or set the GLANCE_DIGITRANSIT_KEY environment variable.

language = "fi"               # "en" or "fi"
timezone = "Europe/Helsinki"

[location]
# Placeholder: Pasila. Put your own coordinates in config.local.toml.
lat = 60.1987
lon = 24.9327

[server]
# The server has no login: anyone on the network it listens on can see the
# dashboard. Keep it on the home network; don't forward the port.
host = "0.0.0.0"
port = 8080
# Requests must name the server by its IP address, a single-label name
# ("raspberrypi"), a .local name or localhost; others are refused, so a web
# page elsewhere can't read the dashboard through a browser at home (DNS
# rebinding). If your network gives the server another name, list it here:
# hostnames = ["glance.home.example"]
#
# Requests must also come from a home network address (private, link-local or
# this machine itself), so a port forwarded on the router by mistake exposes
# nothing. If you reach the server from another range (a VPN's, say), list it:
# allowed_networks = ["100.64.0.0/10"]

[fmi]
# Weather from the Finnish Meteorological Institute (no key needed), for
# [location] and for each other place a weather widget names, each fetched on
# its own.
refresh_minutes = 15
# Show a "weather is old" warning in the status bar after this many minutes
# without a successful fetch.
stale_after_minutes = 45

[digitransit]
# Departures are polled once a minute, this many seconds before the minute
# changes, so they are fresh when the device wakes just after it.
poll_lead_seconds = 15
# A button press (?refresh=1) refetches, but not more often than this.
min_refresh_seconds = 10
# Show a "departures are old" warning after this many minutes without a fetch.
stale_after_minutes = 5

[device]
# Each image response tells the device how long to sleep (X-Glance-Sleep
# header, seconds). It wakes on the minutes of the [schedule] below (multiples
# of the interval since midnight, e.g. :00 :05 :10 for 5), arriving this many
# seconds after the minute changes so the clock on screen is right.
wake_offset_seconds = 2

[battery]
# What the device reads (mV) for a full battery. The percentage uses a generic
# LiPo curve that is full at 4200; a real device reads less when full (the
# cell settles after charging, and its ADC reads a little low), so set this to
# what yours shows when fully charged (see cache/battery.csv on the server).
full_mv = 4200

[cache]
dir = "cache"

# --- Screens, decks and schedule ------------------------------------------
#
# A screen is a grid picture of widget names: words per line give the columns,
# lines give the rows, and each name must fill a rectangle ("." leaves a cell
# empty). Every name needs a [widgets.<name>] section saying what it shows.
#
# A deck is an ordered list of screens; the device's white buttons move
# through the deck that's showing. The schedule picks the deck and how often
# the device wakes. The screen picked stays until the schedule switches to
# another deck, which starts at its `start` screen (default: its first).
# Without any [decks], all screens form one deck.
#
# Put your own setup in config.local.toml: if it has any of [widgets],
# [screens], [decks] or [schedule], all four come from there and none of these
# examples are used.

[screens.home]
grid = """
weather weather hours  hours  hours  hours
trams   trams   buses  buses  trains trains
trams   trams   buses  buses  trains trains
"""

[screens.departures]
grid = """
hours hours hours hours hours sun
trams trams trams buses buses buses
spot  spot  spot  spot  spot  spot
"""

[decks.day]
screens = ["home", "departures"]

[decks.night]
screens = ["home"]

# The first matching rule wins. days: "weekdays", "weekend", "all", one day
# ("sat") or a list like ["mon", "fri"], of the moment itself (00:00-06:00 on a Saturday counts
# as Saturday). "to" is exclusive; a rule may run past midnight (from 23:00 to
# 06:00). A rule without `every` wakes every wake_interval_minutes; without
# `deck`, it shows default_deck. With an interval over 1 minute, departures
# show clock times (14.32) instead of minutes, since countdowns would go stale.

[schedule]
default_deck = "day"
wake_interval_minutes = 5    # when no rule matches

[[schedule.rules]]  # weekday mornings: every minute
days = "weekdays"
from = "07:00"
to = "09:00"
every = 1

[[schedule.rules]]  # nights: every 15 minutes, the home screen only
days = "all"
from = "23:00"
to = "06:00"
every = 15
deck = "night"

# The grid area below the status bar is 800×450 px. Widgets fill their area
# (more hours or departures in a bigger one), down to a minimum size each; a
# smaller area stops the server at startup, saying how many columns or rows
# the widget needs in your grid.
#
# Widget types (minimum size):
#
#   fmi_weather_now     current weather, today's high/low, feels like, wind (245×140)
#   fmi_weather_hourly  hour-by-hour forecast, as many hours as fit (139×130: 3 hours)
#     Both show the weather at [location], or at another place:
#     place  = a town's name, e.g. "Mikkeli", looked up by FMI. Where several
#              places share a name, FMI picks one: the log says where
#              ("weather for Koski updated: … at 61.0222, 25.1542"); a fuller
#              name such as "Koski Tl" picks another.
#     lat, lon = a point instead of a town, e.g. lat = 61.69, lon = 27.27
#     name   = optional heading at the widget's top, e.g. "Mökki" (28 px
#              taller minimum). Without it there is none, for a town too.
#     At most 8 places in all. A name FMI doesn't know is said on the widget.
#   hsl_stops           departures from HSL stops, as many as fit (200×72: one)
#                       (needs a [digitransit] key)
#     name   = optional display name; defaults to HSL's name for the stop. Set
#              it when two widgets would share a name (e.g. trams and buses at
#              the same station) or HSL's name is too long.
#     codes  = stop codes as on the stop sign, e.g. ["H0665"]; list several
#              (e.g. both platforms) to merge them into one widget. Look them
#              up with:  python -m glance stops "Pasila"
#              (Digitransit ids like "HSL:1174411" also work, as `ids`.)
#     routes = optional filter, e.g. ["7", "9"]; omit for all routes
#     Without codes (or with no key configured) it shows placeholder departures.
#   spot_prices         Finland's electricity spot price with VAT: the price for the
#                       quarter hour now, and a bar per quarter hour for the next
#                       24 hours, the cheapest hour in black (530×120). Prices from
#                       Nord Pool's day-ahead market via Elering (no key).
#   sunrise_sunset      today's sunrise and sunset at [location], one above the other,
#                       and the day's length with its change since yesterday; a time
#                       already past is light grey. On a polar night or day, when the
#                       sun next rises or sets. Calculated, not fetched (125×130: one
#                       column of a six-column screen).

[widgets.weather]
type = "fmi_weather_now"

[widgets.hours]
type = "fmi_weather_hourly"

# Another town's weather: on no screen here; add it to a grid to show it.
[widgets.mikkeli]
type = "fmi_weather_hourly"
place = "Mikkeli"
name = "Mikkeli"

[widgets.trams]
type = "hsl_stops"
name = "Pasilan asema, ratikat"
codes = ["H0665", "H0664"]

[widgets.buses]
type = "hsl_stops"
name = "Pasilan asema, bussit"
codes = ["H2100", "H2101"]

[widgets.trains]
type = "hsl_stops"
name = "Pasila, junat"
codes = ["H0086"]

[widgets.spot]
type = "spot_prices"

[widgets.sun]
type = "sunrise_sunset"
